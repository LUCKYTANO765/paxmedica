<svg xmlns="http://www.w3.org/2000/svg" viewBox="100 35 300 465" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Animación de la inyección</title>
  <desc id="description">Jeringa con movimiento del émbolo, descenso del líquido y una gota en la aguja.</desc>
  <style>
    @keyframes plunger-push { 0%,12% {transform:translateY(0)} 48%,58% {transform:translateY(120px)} 92%,100% {transform:translateY(0)} }
    @keyframes liquid-empty { 0%,12% {transform:translateY(0)} 48%,58% {transform:translateY(120px)} 92%,100% {transform:translateY(0)} }
    @keyframes needle-drop { 0%,35% {transform:translateY(0) scale(0);opacity:0} 42% {transform:translateY(0) scale(1);opacity:1} 55% {transform:translateY(18px) scale(.85);opacity:.9} 68%,100% {transform:translateY(40px) scale(0);opacity:0} }
    @keyframes halo-pulse { 0%,100% {opacity:.6} 50% {opacity:1} }
    .syringe-plunger {animation:plunger-push 5s cubic-bezier(.5,.05,.5,.95) infinite}
    .syringe-liquid {animation:liquid-empty 5s cubic-bezier(.5,.05,.5,.95) infinite}
    .needle-drop {animation:needle-drop 5s cubic-bezier(.5,.05,.5,.95) infinite;transform-box:fill-box;transform-origin:center}
    .pump-halo {animation:halo-pulse 4s ease-in-out infinite}
    @media(prefers-reduced-motion:reduce) { .syringe-plunger,.syringe-liquid,.needle-drop,.pump-halo {animation:none} }
  </style>
  <defs>
    <linearGradient id="glass-3d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C4D0DC" stop-opacity=".5"/>
      <stop offset="15%" stop-color="#FFFFFF" stop-opacity=".95"/>
      <stop offset="50%" stop-color="#F0F5FA" stop-opacity=".7"/>
      <stop offset="85%" stop-color="#FFFFFF" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#A8C4DD" stop-opacity=".6"/>
    </linearGradient>
    <linearGradient id="liquid-3d" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1A3D6B" stop-opacity=".95"/>
      <stop offset="25%" stop-color="#5B9BD5" stop-opacity=".95"/>
      <stop offset="55%" stop-color="#7FB6E0" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#1A3D6B" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="liquid-top" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".6"/><stop offset="1" stop-color="#7FB6E0" stop-opacity="0"/></linearGradient>
    <linearGradient id="plunger-3d" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0F2540"/><stop offset=".3" stop-color="#2E6DA4"/><stop offset=".6" stop-color="#5B9BD5"/><stop offset="1" stop-color="#0F2540"/></linearGradient>
    <linearGradient id="rubber-seal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0F2540"/><stop offset=".5" stop-color="#3D5A82"/><stop offset="1" stop-color="#0F2540"/></linearGradient>
    <linearGradient id="needle-grad" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5A6A7A"/><stop offset=".5" stop-color="#D8E0E8"/><stop offset="1" stop-color="#5A6A7A"/></linearGradient>
    <linearGradient id="hub-grad" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#8A9AAA"/><stop offset=".5" stop-color="#E8EFF5"/><stop offset="1" stop-color="#8A9AAA"/></linearGradient>
    <radialGradient id="halo-peso"><stop stop-color="#E8C96D" stop-opacity=".3"/><stop offset=".7" stop-color="#E8C96D" stop-opacity=".05"/><stop offset="1" stop-color="#E8C96D" stop-opacity="0"/></radialGradient>
    <clipPath id="barrel-interior"><rect x="218" y="158" width="64" height="186"/></clipPath>
  </defs>
  <circle class="pump-halo" cx="250" cy="260" r="210" fill="url(#halo-peso)"/>
  <g transform="rotate(-22 250 260)">
    <rect x="200" y="148" width="100" height="14" rx="3" fill="#E8EFF5" stroke="#A8C4DD" stroke-width="1.2"/>
    <rect x="200" y="148" width="100" height="5" fill="#FFFFFF" opacity=".7"/>
    <rect x="216" y="160" width="68" height="186" fill="url(#glass-3d)" stroke="#A8C4DD" stroke-width="1.5"/>
    <line x1="220" y1="160" x2="220" y2="346" stroke="#FFFFFF" stroke-width="2" opacity=".9"/>
    <line x1="280" y1="160" x2="280" y2="346" stroke="#A8C4DD" opacity=".6"/>
    <g clip-path="url(#barrel-interior)">
      <g class="syringe-liquid">
        <rect x="218" y="158" width="64" height="186" fill="url(#liquid-3d)"/>
        <ellipse cx="250" cy="160" rx="32" ry="3" fill="url(#liquid-top)"/>
        <rect x="224" y="160" width="4" height="184" fill="#FFFFFF" opacity=".6"/>
        <rect x="272" y="160" width="6" height="184" fill="#0F2540" opacity=".25"/>
      </g>
    </g>
    <rect x="222" y="164" width="3" height="178" fill="#FFFFFF" opacity=".85"/>
    <rect x="234" y="164" width="2" height="178" fill="#FFFFFF" opacity=".4"/>
    <g stroke="#1A3D6B" stroke-width="1.2" opacity=".8">
      <line x1="216" y1="190" x2="226" y2="190"/><line x1="216" y1="220" x2="222" y2="220"/><line x1="216" y1="250" x2="226" y2="250"/><line x1="216" y1="280" x2="222" y2="280"/><line x1="216" y1="310" x2="226" y2="310"/>
    </g>
    <g font-family="sans-serif" font-size="8" font-weight="700" fill="#1A3D6B"><text x="232" y="193">15</text><text x="232" y="253">10</text><text x="232" y="313">5</text></g>
    <path d="M216 346L240 372H260L284 346Z" fill="url(#glass-3d)" stroke="#A8C4DD" stroke-width="1.5"/>
    <path d="M220 346L242 372" stroke="#FFFFFF" stroke-width="1.5" opacity=".8"/>
    <rect x="240" y="372" width="20" height="18" fill="url(#hub-grad)" stroke="#8A9AAA"/>
    <rect x="240" y="372" width="20" height="3" fill="#FFFFFF" opacity=".7"/>
    <line x1="245" y1="372" x2="245" y2="390" stroke="#8A9AAA" stroke-width=".5"/><line x1="255" y1="372" x2="255" y2="390" stroke="#8A9AAA" stroke-width=".5"/>
    <rect x="248" y="390" width="4" height="62" fill="url(#needle-grad)"/>
    <path d="M248 452H252V462Z" fill="#5A6A7A"/>
    <line x1="250" y1="390" x2="250" y2="460" stroke="#FFFFFF" stroke-width=".5" opacity=".8"/>
    <circle class="needle-drop" cx="250" cy="464" r="4.5" fill="#5B9BD5"/>
    <ellipse class="needle-drop" cx="250" cy="463" rx="1.5" ry=".8" fill="#FFFFFF" opacity=".7"/>
    <g class="syringe-plunger">
      <rect x="208" y="60" width="84" height="14" rx="3" fill="url(#plunger-3d)"/>
      <rect x="208" y="60" width="84" height="4" fill="#5B9BD5" opacity=".6"/>
      <rect x="244" y="74" width="12" height="80" fill="url(#plunger-3d)"/>
      <rect x="246" y="74" width="2" height="80" fill="#FFFFFF" opacity=".5"/>
      <rect x="232" y="84" width="36" height="3" fill="#1A3D6B" opacity=".6"/><rect x="232" y="104" width="36" height="3" fill="#1A3D6B" opacity=".6"/><rect x="232" y="124" width="36" height="3" fill="#1A3D6B" opacity=".6"/>
      <rect x="220" y="148" width="60" height="16" rx="3" fill="url(#rubber-seal)"/>
      <ellipse cx="250" cy="148" rx="30" ry="4" fill="#1A3D6B"/><ellipse cx="250" cy="164" rx="30" ry="4" fill="#0A1A30" opacity=".6"/>
    </g>
  </g>
  <ellipse cx="250" cy="478" rx="140" ry="14" fill="#F5E6D3" opacity=".6"/>
  <ellipse cx="250" cy="478" rx="120" ry="10" fill="#E8D4BB" opacity=".4"/>
</svg>
